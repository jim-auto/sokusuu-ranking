name: Collect Monthly Ranking

on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Year (e.g. 2026)'
        required: true
        default: '2026'
        type: string
      month:
        description: 'Month (1-12)'
        required: true
        default: '10'
        type: string
      mode:
        description: 'Collection mode'
        required: true
        default: 'public'
        type: choice
        options:
          - public
          - authenticated

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run public (cookie-free) collection
        if: inputs.mode == 'public'
        run: |
          python public_monthly_collect.py --year ${{ inputs.year }} --month ${{ inputs.month }}

      - name: Prepare cookie and run authenticated collection
        if: inputs.mode == 'authenticated'
        env:
          TWITTER_COOKIES_JSON: ${{ secrets.TWITTER_COOKIES_JSON }}
        run: |
          mkdir -p data
          if [ -n "$TWITTER_COOKIES_JSON" ]; then
            echo "$TWITTER_COOKIES_JSON" > data/.twitter_cookies.json
          fi
          python monthly_collect.py --mode monthly --year ${{ inputs.year }} --month ${{ inputs.month }}

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/public_monthly_${{ inputs.year }}_${{ inputs.month }}.json || true
          git add -f data/monthly_${{ inputs.year }}_${{ inputs.month }}.json || true
          git commit -m "data: monthly ranking ${{ inputs.year }}-${{ inputs.month }} (${{ inputs.mode }}) [ci skip]" || echo "No changes"
          git push || echo "Nothing to push"
